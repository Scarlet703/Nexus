<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus - Access Portal</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0b0c10;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        /* Cyberpunk Background Glows */
        body::before, body::after {
            content: '';
            position: absolute;
            width: 300px;
            height: 300px;
            border-radius: 50%;
            filter: blur(120px);
            opacity: 0.25;
            z-index: 0;
        }
        body::before {
            background: #00f2fe;
            top: -50px;
            left: -50px;
        }
        body::after {
            background: #9b51e0;
            bottom: -50px;
            right: -50px;
        }

        .portal-container {
            background: rgba(15, 22, 36, 0.85);
            border: 1px solid rgba(0, 242, 254, 0.2);
            padding: 2.5rem;
            border-radius: 16px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.7), 0 0 15px rgba(0, 242, 254, 0.05);
            backdrop-filter: blur(10px);
            z-index: 1;
            transition: all 0.4s ease;
        }

        .portal-container:hover {
            border-color: rgba(0, 242, 254, 0.4);
            box-shadow: 0 0 35px rgba(0, 242, 254, 0.15);
        }

        .logo-area {
            text-align: center;
            margin-bottom: 2rem;
        }

        .logo-area h1 {
            font-size: 2rem;
            font-weight: 800;
            letter-spacing: 2px;
            background: linear-gradient(45deg, #00f2fe, #4facfe);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 10px rgba(0, 242, 254, 0.3);
        }

        .tab-box {
            display: flex;
            background: rgba(255, 255, 255, 0.05);
            padding: 4px;
            border-radius: 8px;
            margin-bottom: 2rem;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .tab-btn {
            flex: 1;
            padding: 10px;
            background: transparent;
            border: none;
            color: #8892b0;
            font-weight: 600;
            cursor: pointer;
            border-radius: 6px;
            transition: all 0.3s ease;
        }

        .tab-btn.active {
            background: linear-gradient(135deg, #00f2fe, #9b51e0);
            color: #ffffff;
            box-shadow: 0 2px 10px rgba(0, 242, 254, 0.2);
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-group label {
            display: block;
            font-size: 0.85rem;
            color: #8892b0;
            margin-bottom: 0.5rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .form-group input {
            width: 100%;
            padding: 12px 16px;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            color: white;
            font-size: 1rem;
            outline: none;
            transition: all 0.3s ease;
        }

        .form-group input:focus {
            border-color: #00f2fe;
            box-shadow: 0 0 10px rgba(0, 242, 254, 0.2);
            background: rgba(0, 0, 0, 0.5);
        }

        .action-btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(90deg, #00f2fe, #9b51e0);
            border: none;
            border-radius: 8px;
            color: white;
            font-size: 1rem;
            font-weight: 700;
            letter-spacing: 1px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(155, 81, 224, 0.2);
            transition: all 0.3s ease;
            margin-top: 1rem;
        }

        .action-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 242, 254, 0.4);
            filter: brightness(1.1);
        }

        .hidden {
            display: none;
        }

        .back-home {
            display: block;
            text-align: center;
            margin-top: 1.5rem;
            color: #8892b0;
            text-decoration: none;
            font-size: 0.9rem;
            transition: color 0.3s;
        }

        .back-home:hover {
            color: #00f2fe;
        }
    </style>
</head>
<body>

    <div class="portal-container">
        <div class="logo-area">
            <h1>NEXUS PORTAL</h1>
        </div>

        <div class="tab-box">
            <button class="tab-btn active" onclick="switchTab('login')">LOG IN</button>
            <button class="tab-btn" onclick="switchTab('signup')">JOIN</button>
        </div>

        <form id="login-form" onsubmit="handleAuth(event, 'Welcome back to Nexus!')">
            <div class="form-group">
                <label>Identity / Email</label>
                <input type="email" placeholder="Enter your email" required>
            </div>
            <div class="form-group">
                <label>Passkey</label>
                <input type="password" placeholder="••••••••" required>
            </div>
            <button type="submit" class="action-btn">ENTER NEXUS</button>
        </form>

        <form id="signup-form" class="hidden" onsubmit="handleAuth(event, 'Account synchronized. Welcome to the grid!')">
            <div class="form-group">
                <label>Choose Handle (Username)</label>
                <input type="text" placeholder="e.g., CyberWizard44" required>
            </div>
            <div class="form-group">
                <label>Secure Email</label>
                <input type="email" placeholder="your@email.com" required>
            </div>
            <div class="form-group">
                <label>Create Passkey</label>
                <input type="password" placeholder="••••••••" required>
            </div>
            <button type="submit" class="action-btn">INITIALIZE ACCOUNT</button>
        </form>

        <a href="index.html" class="back-home">← Return to Main Deck</a>
    </div>

    <script>
        function switchTab(type) {
            const tabs = document.querySelectorAll('.tab-btn');
            const loginForm = document.getElementById('login-form');
            const signupForm = document.getElementById('signup-form');

            if (type === 'login') {
                tabs[0].classList.add('active');
                tabs[1].classList.remove('active');
                loginForm.classList.remove('hidden');
                signupForm.classList.add('hidden');
            } else {
                tabs[0].classList.remove('active');
                tabs[1].classList.add('active');
                loginForm.classList.add('hidden');
                signupForm.remove('hidden');
                signupForm.classList.remove('hidden');
            }
        }

        function handleAuth(event, message) {
            event.preventDefault();
            alert(message);
            window.location.href = "index.html"; 
        }
    </script>
</body>
</html>
